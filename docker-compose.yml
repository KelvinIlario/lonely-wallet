services:
  carteira:
    build: .
    container_name: lonely-wallet
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      DB_PATH: /data/carteira.db
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      BRAPI_API_KEY: ${BRAPI_API_KEY:-}
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
