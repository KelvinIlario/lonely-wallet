services:
  lonely-wallet:
    image: lonker/lonely-wallet:latest
    container_name: lonely-wallet
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - BRAPI_TOKEN=COLOQUE_SEU_TOKEN_AQUI
      - DATA_DIR=/data
      - TZ=America/Sao_Paulo
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
