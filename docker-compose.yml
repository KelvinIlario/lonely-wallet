services:
  lonely-wallet:
    image: lonker/lonely-wallet:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lonely-wallet
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "8085:8080"
    environment:
      BRAPI_TOKEN: ""
      DB_PATH: /data/carteira.db
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
    labels:
      icon: "http://192.168.31.79:8085/static/lonely-wallet-icon-v2.0.57.png"
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"

x-casaos:
  hostname: ""
  architectures:
    - amd64
  author: Lonely Wallet
  category: Finance
  description:
    pt_BR: Carteira pessoal para acompanhar investimentos, posições e proventos.
    en_US: Personal investment portfolio dashboard.
  developer: Lonely Wallet
  icon: "http://192.168.31.79:8085/static/lonely-wallet-icon-v2.0.57.png"
  index: /
  is_uncontrolled: false
  main: lonely-wallet
  port_map: "8085"
  scheme: http
  title:
    custom: Lonely Wallet
