services:
  lonely-wallet:
    build: .
    container_name: lonely-wallet
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      DB_PATH: /data/carteira.db
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      BRAPI_API_KEY: ${BRAPI_API_KEY:-}
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"

x-casaos:
  hostname: ""
  index: /
  is_uncontrolled: false
  main: lonely-wallet
  port_map: "8085"
  scheme: http
  title:
    custom: Lonely Wallet
