services:
  lonely-wallet:
    image: lonker/lonely-wallet:latest
    container_name: lonely-wallet
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - DATA_DIR=/data
      - TZ=America/Sao_Paulo
      # Configure BRAPI_TOKEN in ZimaOS if you already use a token.
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
