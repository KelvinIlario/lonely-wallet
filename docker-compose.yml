services:
  carteira:
    build: .
    container_name: minha-carteira
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/carteira.db
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      BRAPI_API_KEY: ${BRAPI_API_KEY:-}
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/data
