<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14161d"><title>Lonely Wallet | Acesso</title>
<link rel="icon" type="image/png" href="/static/lonely-wallet-favicon.png">
<style>
:root{color-scheme:dark;--bg:#14161d;--panel:#20232c;--line:#303541;--text:#f3f5f8;--muted:#929baa;--gold:#d5a85e;--blue:#2478d4;--red:#ef6680}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#302345 0,transparent 55%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,390px);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0008;text-align:center}.logo{width:76px;height:76px;object-fit:contain;border-radius:16px;margin-bottom:14px}.brand{font-size:22px;font-weight:750;letter-spacing:-.5px}.brand span{color:var(--gold)}p{color:var(--muted);line-height:1.5;margin:9px 0 22px}.field{text-align:left;margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:#171a22;color:var(--text);font-size:20px;letter-spacing:7px;text-align:center;outline:none}input:focus{border-color:var(--blue)}button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:wait}.msg{min-height:20px;color:var(--red);font-size:12px;margin-top:12px}.hint{font-size:11px;color:var(--muted);margin-top:18px}
</style></head>
<body><main class="card"><img class="logo" src="/static/lonely-wallet-favicon.png" alt="Lonely Wallet"><div class="brand">Lonely <span>Wallet</span></div><p id="subtitle">Acesse sua carteira de investimentos com seu PIN.</p>
<form id="authForm"><div class="field"><label for="pin">PIN DE ACESSO</label><input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,12}" minlength="6" maxlength="12" required></div>
<div class="field" id="confirmWrap" hidden><label for="confirm">CONFIRMAR PIN</label><input id="confirm" name="confirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6,12}" minlength="6" maxlength="12"></div>
<button id="submit" type="submit">Entrar</button></form><div class="msg" id="message" role="alert"></div><div class="hint">Seu PIN é armazenado de forma protegida neste dispositivo.</div></main>
<script>
(async()=>{const form=document.getElementById('authForm'),pin=document.getElementById('pin'),confirm=document.getElementById('confirm'),wrap=document.getElementById('confirmWrap'),button=document.getElementById('submit'),message=document.getElementById('message'),subtitle=document.getElementById('subtitle');let setup=false;try{const r=await fetch('/api/auth/status',{cache:'no-store'});const s=await r.json();setup=!s.configured;if(s.authenticated){location.replace('/');return}}catch(e){}if(setup){subtitle.textContent='Crie um PIN de 6 a 12 números para proteger sua carteira.';wrap.hidden=false;confirm.required=true;button.textContent='Criar PIN'}form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';button.disabled=true;try{const endpoint=setup?'/api/auth/setup':'/api/auth/login',body=setup?{pin:pin.value,confirm:confirm.value}:{pin:pin.value};const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'Não foi possível autenticar.');location.replace('/')}catch(err){message.textContent=err.message;pin.value='';pin.focus()}finally{button.disabled=false}});pin.focus()})();
</script></body></html>
